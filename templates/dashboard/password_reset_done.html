{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Email Sent - MyPrestasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; display: flex; height: 100vh; background-color: #fff1f2; justify-content: center; align-items: center; }
        .done-box { background: white; width: 100%; max-width: 450px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(190, 18, 60, 0.08); border: 1px solid #ffe4e6; text-align: center; }
        .btn-back { display: inline-block; width: 100%; background: #be123c; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 14px; text-decoration: none; box-sizing: border-box; transition: 0.3s; margin-top: 20px; }
        .btn-back:hover { background: #881337; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="done-box">
        <div style="width: 60px; height: 60px; background: #f0fdf4; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; color: #16a34a;">
            <svg style="width: 30px; height: 30px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <h1 style="color: #881337; font-weight: 900; font-size: 24px; margin: 0 0 10px 0;">Reset Link Sent</h1>
        <p style="color: #64748b; font-size: 13px; margin: 0 0 20px 0; font-weight: 500; line-height: 1.5;">We have sent a password reset link to your email. Please check your inbox and follow the instructions to reset your password.</p>
        <a href="{% url 'login' %}" class="btn-back">Back to Login</a>
    </div>
</body>
</html>
