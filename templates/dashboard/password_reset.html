{% load static %}
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MyPrestasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; display: flex; height: 100vh; background-color: #fff1f2; justify-content: center; align-items: center; }
        .reset-box { background: white; width: 100%; max-width: 450px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(190, 18, 60, 0.08); border: 1px solid #ffe4e6; text-align: center;}
        
        .input-group { margin-bottom: 25px; text-align: left;}
        .input-group label { display: block; font-size: 11px; font-weight: 800; color: #881337; margin-bottom: 8px; text-transform: uppercase;}
        .input-group input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid #ffe4e6; background: #f8fafc; font-family: 'Inter'; font-size: 14px; color: #881337; font-weight: 600; box-sizing: border-box;}
        
        .btn-submit { width: 100%; background: #be123c; color: white; border: none; padding: 16px; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.3s;}
        .btn-submit:hover { background: #881337; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="reset-box">
        <div style="width: 60px; height: 60px; background: #fff1f2; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; color: #be123c;">
            <svg style="width: 30px; height: 30px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h1 style="color: #881337; font-weight: 900; font-size: 26px; margin: 0 0 10px 0;">Reset Password</h1>
        <p style="color: #64748b; font-size: 13px; margin: 0 0 30px 0; font-weight: 500; line-height: 1.5;">Enter your registered email address. We will send you a secure link to reset your password.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-submit">SEND RESET LINK</button>
        </form>
        
        <div style="margin-top: 25px;">
            <a href="{% url 'login' %}" style="color: #be123c; font-size: 13px; font-weight: 700; text-decoration: none;">← Back to Login</a>
        </div>
    </div>

</body>
</html>
