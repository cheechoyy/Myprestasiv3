    <!-- SKRIP BUTANG MENU SIDEBAR -->
    <script>
        (function () {
            var sidebar = document.getElementById('mySidebar');
            var btn = document.getElementById('sidebarMenuBtn');
            if (!sidebar || !btn) return;

            var KEY = 'myprestasi.staffSidebarExpanded';
            var isDesktop = function () { return window.matchMedia('(min-width: 1024px)').matches; };

            function setExpanded(expanded) {
                sidebar.classList.toggle('is-expanded', expanded);
                btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            }

            // Pulihkan pilihan terakhir (desktop sahaja) tanpa animasi semasa halaman dimuatkan
            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) {}
            if (isDesktop() && saved === '1') {
                sidebar.classList.add('no-transition');
                setExpanded(true);
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () { sidebar.classList.remove('no-transition'); });
                });
            }

            btn.addEventListener('click', function () {
                var expanded = !sidebar.classList.contains('is-expanded');
                setExpanded(expanded);
                if (isDesktop()) {
                    try { localStorage.setItem(KEY, expanded ? '1' : '0'); } catch (e) {}
                }
                // Saiz semula carta Plotly selepas animasi sidebar selesai
                setTimeout(function () {
                    if (typeof Plotly !== 'undefined') {
                        document.querySelectorAll('.js-plotly-plot').forEach(function (el) { Plotly.Plots.resize(el); });
                    }
                    window.dispatchEvent(new Event('resize'));
                }, 360);
            });
        })();
    </script>
